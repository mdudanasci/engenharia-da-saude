  <div class="app">
    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#dashboard" data-nav="dashboard">
        <img src="assets/favicon.png" alt="Engenharia da Saúde" class="brand-mark" />
        <span class="brand-text">
          <strong>Engenharia<span>da Saúde</span></strong>
          <small>Gestão de Home Care</small>
        </span>
      </a>

      <nav class="nav" aria-label="Menu principal">
        <p class="nav-label">Visão geral</p>
        <button class="nav-item" data-nav="dashboard"><svg><use href="#i-grid"/></svg><span>Painel</span></button>
        <button class="nav-item" data-nav="scales"><svg><use href="#i-table"/></svg><span>Escalas</span></button>

        <p class="nav-label">Cadastros</p>
        <button class="nav-item" data-nav="patients"><svg><use href="#i-users"/></svg><span>Pacientes</span><span class="nav-count" id="navPatientCount">0</span></button>
        <button class="nav-item" data-nav="techniques"><svg><use href="#i-id"/></svg><span>Técnicas</span><span class="nav-count" id="navTechCount">0</span></button>

        <p class="nav-label">Análise</p>
        <button class="nav-item" data-nav="reports"><svg><use href="#i-chart"/></svg><span>Relatórios</span></button>
      </nav>

      <div class="side-promo">
        <div class="side-promo-icon"><svg><use href="#i-table"/></svg></div>
        <p><strong>Controle de escalas</strong><span>Lance os plantões do mês em segundos.</span></p>
        <button class="side-promo-btn" data-nav="scales">Abrir escala <svg><use href="#i-arrow"/></svg></button>
      </div>

      <div class="side-foot">
        <span class="save-dot"></span>
        <span>Dados salvos neste navegador</span>
        <button class="icon-btn tiny" data-action="open-settings" title="Configurações e backup"><svg><use href="#i-settings"/></svg></button>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <!-- ============ CONTEÚDO ============ -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menu"><svg><use href="#i-menu"/></svg></button>
          <div class="crumb">
            <span>Engenharia da Saúde</span>
            <svg><use href="#i-chevron"/></svg>
            <strong id="crumbCurrent">Painel</strong>
          </div>
        </div>

        <div class="topbar-right">
          <label class="global-search" for="globalSearch">
            <svg><use href="#i-search"/></svg>
            <input id="globalSearch" type="search" placeholder="Buscar paciente, técnica..." autocomplete="off" />
            <kbd>/</kbd>
          </label>
          <button class="icon-btn" data-action="open-notifications" aria-label="Notificações" title="Notificações">
            <svg><use href="#i-bell"/></svg><span class="dot"></span>
          </button>
          <button class="btn btn-primary btn-sm" data-action="import-sheet"><svg><use href="#i-upload"/></svg> <span>Importar planilha</span></button>
          <div class="user-chip" data-action="open-profile" title="Meu cadastro">
            <span class="avatar">MD</span>
            <span class="user-meta"><strong>Marina Duarte</strong><small>Enfermeira · Admin</small></span>
          </div>
        </div>
      </header>

      <div class="page" id="app"></div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="modal-root" id="modalRoot"></div>
  <div class="auth-root" id="authRoot" hidden></div>

  <script src="assets/app.js"></script>
  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#fbf7f1;font-family:sans-serif;padding:24px;text-align:center">Ative o JavaScript do navegador para usar o sistema.</div></noscript>
</body>
</html>
